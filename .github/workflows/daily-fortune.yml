name: Daily Fortune Generator

# API 비용 때문에 매일 자동 실행은 꺼 둠 — 필요할 때 Actions 탭에서 수동 실행
# (다시 켜려면 아래 주석 해제: 매일 UTC 14:30 = 한국시간 23:30에 다음 날 운세 생성)
on:
  # schedule:
  #   - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '시작 날짜 (YYYY-MM-DD, 비우면 내일)'
        required: false
      days:
        description: '생성할 일수'
        required: false
        default: '1'

permissions:
  contents: write

concurrency:
  group: daily-fortune
  cancel-in-progress: false

jobs:
  generate-fortune:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate fortune
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORTUNE_MODEL: ${{ vars.FORTUNE_MODEL }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_DAYS: ${{ github.event.inputs.days }}
        run: |
          ARGS=""
          if [ -n "$INPUT_DATE" ]; then ARGS="$ARGS --date $INPUT_DATE"; fi
          if [ -n "$INPUT_DAYS" ]; then ARGS="$ARGS --days $INPUT_DAYS"; fi
          if [ -z "$FORTUNE_MODEL" ]; then unset FORTUNE_MODEL; fi
          python generate_fortune.py $ARGS

      - name: Commit generated data
        run: |
          echo "Last fortune generation: $(date -u)" > .last_run
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .last_run data/
          git diff --staged --quiet || git commit -m "🔮 Auto: fortune data generated at $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
