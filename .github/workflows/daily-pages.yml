name: Daily Pages

# 매일 자정(한국시간)에 오늘의 운세를 정적 페이지로 만들고 검색엔진에 알림. API 비용 없음.
# tools/indexnow-all.txt 를 고쳐서 올리면 모든 주소를 한 번에 다시 알림
on:
  schedule:
    - cron: '7 15 * * *'   # UTC 15:07 = 한국시간 00:07
  workflow_dispatch:
    inputs:
      all:
        description: '모든 주소를 IndexNow 로 알림 (true/false)'
        required: false
        default: 'false'
  push:
    branches: [main]
    paths: ['tools/indexnow-all.txt']

permissions:
  contents: write

concurrency:
  group: daily-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build pages
        run: |
          python tools/build_daily.py
          python tools/site_index.py

      - name: Commit pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --staged --quiet || git commit -m "📅 오늘의 운세 페이지 생성 $(TZ=Asia/Seoul date +'%Y-%m-%d')"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Wait for deploy
        run: sleep 90

      - name: Notify search engines
        continue-on-error: true
        env:
          NOTIFY_ALL: ${{ github.event_name == 'push' || github.event.inputs.all == 'true' }}
        run: |
          if [ "$NOTIFY_ALL" = "true" ]; then python tools/indexnow.py --all; else python tools/indexnow.py; fi

      - name: Save notify result
        continue-on-error: true
        run: |
          git add tools/indexnow_last.json
          git diff --staged --quiet || git commit -m "IndexNow 결과 기록"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
